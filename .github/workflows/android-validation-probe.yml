name: Android Cross-Repo Validation

on:
  pull_request:
    paths:
      - '.github/workflows/android-validation-probe.yml'

permissions:
  contents: read

jobs:
  validate-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_ANDROID_SHA: "99c7a7a1fa8b6e508029260a5c7bdb21776c9e9d"
      DARWPHONE_NDK_VERSION: "27.3.13750724"
      DARWPHONE_ABIS: "arm64-v8a armeabi-v7a x86_64 x86"
      DARWPHONE_VERIFY_RELEASE: "1"
      DARWPHONE_REQUIRE_SIGNED_RELEASE: "0"
      TOKEN_ANDROID_REPO: ${{ secrets.ANDROID_REPO_TOKEN }}
      TOKEN_CROSS_REPO: ${{ secrets.CROSS_REPO_TOKEN }}
      TOKEN_GH_PAT: ${{ secrets.GH_PAT }}
      TOKEN_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      TOKEN_REPO: ${{ secrets.REPO_TOKEN }}
      TOKEN_PAT: ${{ secrets.PAT }}

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android/native prerequisites
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;27.3.13750724"
          sudo apt-get update
          sudo apt-get install -y yasm

      - name: Clone exact private Android validation source
        run: |
          set -euo pipefail
          token=""
          for candidate in \
            "$TOKEN_ANDROID_REPO" \
            "$TOKEN_CROSS_REPO" \
            "$TOKEN_GH_PAT" \
            "$TOKEN_GITHUB_PAT" \
            "$TOKEN_REPO" \
            "$TOKEN_PAT"; do
            if [[ -n "$candidate" ]]; then
              token="$candidate"
              break
            fi
          done

          if [[ -z "$token" ]]; then
            echo "No cross-repository read token is configured in this repository." >&2
            echo "Checked ANDROID_REPO_TOKEN, CROSS_REPO_TOKEN, GH_PAT, GITHUB_PAT, REPO_TOKEN and PAT without exposing values." >&2
            exit 2
          fi

          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            clone --branch release/final-hardening --single-branch \
            https://github.com/darwvin-dev/Android-Softphone.git android-softphone
          cd android-softphone
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_ANDROID_SHA" || {
            echo "Expected Android SHA $EXPECTED_ANDROID_SHA but cloned $actual" >&2
            exit 2
          }
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            submodule update --init --recursive
          git status --short

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run complete DarwPhone local verification gate
        working-directory: android-softphone
        run: bash scripts/verify-local.sh

      - name: Record cross-repo validation metadata
        if: success()
        working-directory: android-softphone
        run: |
          mkdir -p app/build/release-evidence
          {
            echo "android_git_commit=$(git rev-parse HEAD)"
            echo "validation_host_repo=darwvin-dev/screenshot-organizer-legal"
            echo "validation_workflow_run=$GITHUB_RUN_ID"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > app/build/release-evidence/cross-repo-validation.txt

      - name: Upload Android validation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-softphone-validation-${{ env.EXPECTED_ANDROID_SHA }}
          retention-days: 30
          if-no-files-found: error
          path: |
            android-softphone/app/build/reports/tests/testDebugUnitTest/
            android-softphone/app/build/reports/lint-results-debug.*
            android-softphone/app/build/outputs/apk/debug/*.apk
            android-softphone/app/build/outputs/apk/androidTest/debug/*.apk
            android-softphone/app/build/outputs/apk/release/*.apk
            android-softphone/app/build/outputs/bundle/release/*.aab
            android-softphone/app/build/release-evidence/
